[package]
name = "driverix"
version = "0.1.0"
description = "Driver detection and safe updates via Windows Update, with backup and rollback"
authors = ["juninmd"]
edition = "2021"
license = "MIT"
default-run = "driverix"

[lib]
name = "driverix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "driverix"
path = "src/main.rs"

[[bin]]
name = "driverix-cli"
path = "src/bin/driverix-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
